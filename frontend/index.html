<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!--
      The API host replaces the placeholder in the base tag with the configured URL base (P0-08a),
      so relative asset URLs resolve under that base on every route. The server replaces every
      occurrence of the placeholder, so it may appear literally only in the base tag.
    -->
        <base href="__URL_BASE__/" />
        <title>Wondarr</title>
        <link rel="icon" href="./favicon.ico" sizes="48x48" />
        <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
        <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
        <script>
            // Vite's dev server serves this file verbatim, so the placeholder survives; fall back to the
            // site root there. The placeholder is assembled at runtime: written literally, the API
            // host would rewrite it too, and this would then reset the real URL base to "/".
            (function () {
                var base = document.querySelector('base');
                var placeholder = '__URL' + '_BASE__/';
                if (base && base.getAttribute('href') === placeholder) {
                    base.setAttribute('href', '/');
                }
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/app/main.tsx"></script>
    </body>
</html>
