# Wondarr — single-service reference compose (docs/architecture/DEPLOYMENT.md §9.3).
# slskd is bundled inside the image, so there is nothing else to wire up.
services:
  wondarr:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/wulfftech/wondarr:develop
    container_name: wondarr
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
    volumes:
      - ./config:/config
      - ./data:/data
    ports:
      - "1077:1077"
      - "50300:50300"
    restart: unless-stopped
