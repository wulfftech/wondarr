name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Frontend and image jobs switch on once those parts of Phase 0 exist.
  detect:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.parts.outputs.frontend }}
      docker: ${{ steps.parts.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      - id: parts
        run: |
          echo "frontend=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "docker=$([ -f docker/Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Ported code is listed in NOTICE.md
        run: python3 scripts/check-notice.py
      - run: dotnet restore
      - run: dotnet build -warnaserror --no-restore
      - run: dotnet test --no-build --logger "console;verbosity=normal"

  frontend:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run format
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [detect, backend, frontend]
    if: ${{ !cancelled() && !failure() && needs.detect.outputs.docker == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: compilarr:ci
          build-args: VERSION=0.0.0-ci.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The repository (and so the GHCR package) is private; a short-lived artifact lets the image be
      # loaded on a test host without registry credentials there.
      - name: Export the image
        if: github.event_name == 'push'
        run: docker save compilarr:ci | gzip -1 > compilarr-image-amd64.tar.gz
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: compilarr-image-amd64
          path: compilarr-image-amd64.tar.gz
          retention-days: 3
      # Phase 0 and Phase 1 gates. The Phase 1 gate pastes 50 songs; the metadata services answer from
      # the recording in tests/gate/replay (scripts/metadata-replay.py), so CI never calls them.
      - name: Phase gate smoke test (Phase 0 + Phase 1)
        run: scripts/smoke-test.sh compilarr:ci
