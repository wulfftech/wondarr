name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this workflow so a release runs the same backend and frontend suites.
  workflow_call:
    inputs:
      tests-only:
        description: Run the backend and frontend jobs only (the caller builds and tests the image itself)
        type: boolean
        default: false

permissions:
  contents: read

# github.workflow is the caller's name in a called workflow, so a release's run of these jobs does not
# share a group with (and cancel) the push run of CI on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Frontend and image jobs switch on once those parts of Phase 0 exist.
  detect:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.parts.outputs.frontend }}
      docker: ${{ steps.parts.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: parts
        run: |
          echo "frontend=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "docker=$([ -f docker/Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Ported code is listed in NOTICE.md
        run: python3 scripts/check-notice.py
      - run: dotnet restore
      - run: dotnet build -warnaserror --no-restore
      - run: dotnet test --no-build --logger "console;verbosity=normal"

  frontend:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run format
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [detect, backend, frontend]
    if: ${{ !cancelled() && !failure() && needs.detect.outputs.docker == 'true' && !inputs.tests-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: wondarr:ci
          build-args: VERSION=0.0.0-ci.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The repository (and so the GHCR package) is private; a short-lived artifact lets the image be
      # loaded on a test host without registry credentials there.
      - name: Export the image
        if: github.event_name == 'push'
        run: docker save wondarr:ci | gzip -1 > wondarr-image-amd64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: wondarr-image-amd64
          path: wondarr-image-amd64.tar.gz
          retention-days: 3
      # Phase 0, 1 and 2 gates. The Phase 1 gate pastes 50 songs; the metadata services answer from
      # the recording in tests/gate/replay (scripts/metadata-replay.py), so CI never calls them.
      # The Phase 2 gate replaces the bundled slskd with tools/FakeSlskd (published in the SDK image) and
      # imports 20 of those songs through the real pipeline, with a disguised live take and a refused transfer.
      - name: Phase gate smoke test (Phase 0 to Phase 3)
        run: scripts/smoke-test.sh wondarr:ci
