name: Release image

# :develop from main, semver tags (and :latest for non-prerelease versions) from v* tags.
# Every pushed image is smoke-tested natively on amd64 and arm64 (the Phase 0 and Phase 1 gates);
# a v* tag then becomes a GitHub Release whose notes are its CHANGELOG.md section.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/wulfftech/wondarr

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - id: parts
        run: echo "docker=$([ -f docker/Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.parts.outputs.docker == 'true'
        uses: docker/setup-qemu-action@v4

      - if: steps.parts.outputs.docker == 'true'
        uses: docker/setup-buildx-action@v4

      - if: steps.parts.outputs.docker == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.parts.outputs.docker == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-') }}
            type=raw,value=develop,enable={{is_default_branch}}
            type=sha,format=short
          flavor: |
            latest=auto

      - if: steps.parts.outputs.docker == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # dotnet needs a semver: the tag's version on releases, 0.0.0-develop.<run> otherwise
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || format('0.0.0-develop.{0}', github.run_number) }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

  # The pushed image itself, by digest, on a native runner of each architecture: QEMU only builds the
  # arm64 image, so this is the first time it runs on arm64 hardware.
  smoke:
    needs: image
    if: needs.image.outputs.digest != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Pull the pushed image
        run: |
          docker pull --platform "linux/${{ matrix.arch }}" "${IMAGE}@${{ needs.image.outputs.digest }}"
          docker tag "${IMAGE}@${{ needs.image.outputs.digest }}" wondarr:release
          test "$(docker image inspect wondarr:release --format '{{.Architecture}}')" = "${{ matrix.arch }}"
      - name: Phase 0 and Phase 1 gates
        env:
          SMOKE_PHASE2: "off"
          SMOKE_PHASE3: "off"
          SMOKE_PHASE4: "off"
          SMOKE_PHASE5: "off"
          SMOKE_PHASE6: "off"
          SMOKE_PHASE7: "off"
        run: scripts/smoke-test.sh wondarr:release

  github-release:
    needs: [image, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section "## [<version>] ..." up to the next "## [" heading.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          printf '\n**Image:** `docker pull %s:%s` (linux/amd64, linux/arm64)\n' "$IMAGE" "$version" >> notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Wondarr ${GITHUB_REF_NAME#v}" --notes-file notes.md $flags
