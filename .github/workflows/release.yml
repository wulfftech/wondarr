name: Release image

# :develop from main, semver tags (and :latest for the highest stable release) from v* tags.
#
# The image job pushes by digest under a sha-* tag only. The tags production follows (:0.1, :latest,
# :develop, :<version>) move in the promote job, which needs both the smoke matrix (the pushed image
# itself, natively on amd64 and arm64) and the test suites (ci.yml, called). A v* tag then becomes a
# GitHub Release whose notes are its CHANGELOG.md section, once the tags have moved. The dockerhub job
# copies the same digest and tags to Docker Hub (mirror-dockerhub.yml, called).
#
#   image ──► smoke (amd64, arm64) ──┐                ┌──► github-release (v* tags only)
#   test  (ci.yml: backend, frontend) ┴──► promote ──┤
#                                                     └──► dockerhub (skipped without its secrets)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/wulfftech/wondarr

jobs:
  # The backend and frontend suites of ci.yml, so a release never publishes a red tree. The image
  # build of ci.yml is skipped here: the image job below builds the real one.
  test:
    uses: ./.github/workflows/ci.yml
    with:
      tests-only: true
    permissions:
      contents: read

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      # The full tag list (one per line), applied by the promote job once the image has passed.
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every v* tag, to tell whether this one is the highest stable release.
          fetch-tags: true

      - id: parts
        run: |
          echo "docker=$([ -f docker/Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # The same short form the metadata action's type=sha,format=short produces.
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # :latest follows the highest stable release only: tagging a v0.1.5 backport after v0.2.0
      # exists must not move it backwards, and a prerelease never moves it.
      - id: latest
        run: |
          is_latest=false
          highest=""
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != *-* ]]; then
            highest="$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-' | head -n 1 || true)"
            if [ "$highest" = "$GITHUB_REF_NAME" ]; then
              is_latest=true
            fi
          fi
          echo "value=$is_latest" >> "$GITHUB_OUTPUT"
          echo "latest=$is_latest (highest stable tag: ${highest:-n/a})"

      - if: steps.parts.outputs.docker == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - if: steps.parts.outputs.docker == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.parts.outputs.docker == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.parts.outputs.docker == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.value == 'true' }}
            type=raw,value=develop,enable={{is_default_branch}}
            type=sha,format=short
          flavor: |
            latest=false

      - if: steps.parts.outputs.docker == 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Only the sha-* tag: the moving tags are the promote job's to apply.
          tags: ${{ env.IMAGE }}:${{ steps.parts.outputs.sha_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          # dotnet needs a semver: the tag's version on releases, 0.0.0-develop.<run> otherwise
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || format('0.0.0-develop.{0}', github.run_number) }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

  # The pushed image itself, by digest, on a native runner of each architecture: QEMU only builds the
  # arm64 image, so this is the first time it runs on arm64 hardware.
  smoke:
    needs: image
    if: needs.image.outputs.digest != ''
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull the pushed image
        run: |
          docker pull --platform "linux/${{ matrix.arch }}" "${IMAGE}@${{ needs.image.outputs.digest }}"
          docker tag "${IMAGE}@${{ needs.image.outputs.digest }}" wondarr:release
          test "$(docker image inspect wondarr:release --format '{{.Architecture}}')" = "${{ matrix.arch }}"
      - name: Phase 0 and Phase 1 gates
        env:
          SMOKE_PHASE2: "off"
          SMOKE_PHASE3: "off"
          SMOKE_PHASE4: "off"
          SMOKE_PHASE5: "off"
          SMOKE_PHASE6: "off"
          SMOKE_PHASE7: "off"
        run: scripts/smoke-test.sh wondarr:release

  # Moves :<version>, :<major>.<minor>, :latest and :develop onto the digest that passed. This is the
  # only place those tags are written on GHCR (the dockerhub job copies them from here), and it runs only
  # when the smoke matrix and the tests are green.
  promote:
    needs: [image, smoke, test]
    if: needs.image.outputs.digest != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply the moving tags
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          TAGS: ${{ needs.image.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            # The sha-* tag was pushed with the image.
            case "$tag" in
              "" | *:sha-*) ;;
              *)
                echo "promoting ${IMAGE}@${DIGEST} to ${tag}"
                args+=(--tag "$tag")
                ;;
            esac
          done <<< "$TAGS"
          if [ "${#args[@]}" -eq 0 ]; then
            echo "the metadata action produced no moving tags for this ref" >&2
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"

  # Its own job rather than a step of promote, so a Docker Hub outage never holds back the GHCR tags or
  # the GitHub Release.
  dockerhub:
    needs: [image, promote]
    if: needs.image.outputs.digest != ''
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/mirror-dockerhub.yml
    with:
      digest: ${{ needs.image.outputs.digest }}
      tags: ${{ needs.image.outputs.tags }}
    secrets: inherit

  github-release:
    needs: promote
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section "## [<version>] ..." up to the next "## [" heading.
          section() {
            awk -v v="$1" '
              index($0, "## [" v "]") == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
          }
          section "$version" > notes.md
          # A pre-release (1.2.3-rc.1) without a section of its own carries the notes of the version it leads to.
          base="${version%%-*}"
          if [ ! -s notes.md ] && [ "$base" != "$version" ]; then
            { printf '**Release candidate for %s.** The notes below are those of %s.\n' "$base" "$base"; section "$base"; } > notes.md
          fi
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          printf '\n**Image:** `docker pull %s:%s` (linux/amd64, linux/arm64)\n' "$IMAGE" "$version" >> notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Wondarr ${GITHUB_REF_NAME#v}" --notes-file notes.md $flags
