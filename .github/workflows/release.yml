name: Release image

# :develop from main, semver tags (and :latest for non-prerelease versions) from v* tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/wulfftech/wondarr

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: parts
        run: echo "docker=$([ -f docker/Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.parts.outputs.docker == 'true'
        uses: docker/setup-qemu-action@v4

      - if: steps.parts.outputs.docker == 'true'
        uses: docker/setup-buildx-action@v4

      - if: steps.parts.outputs.docker == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.parts.outputs.docker == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=develop,enable={{is_default_branch}}
            type=sha,format=short
          flavor: |
            latest=auto

      - if: steps.parts.outputs.docker == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # dotnet needs a semver: the tag's version on releases, 0.0.0-develop.<run> otherwise
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || format('0.0.0-develop.{0}', github.run_number) }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
