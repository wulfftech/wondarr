# Records the metadata a phase gate asks MusicBrainz, the Cover Art Archive, Deezer and iTunes for,
# so CI can replay it (scripts/metadata-replay.py). Run by hand when a gate's songs change; it never
# re-records what tests/gate/replay already holds. The new recordings come back as an artifact for the
# orchestrator to review and commit.
name: Record gate metadata

on:
  workflow_dispatch:
    inputs:
      only-phase6:
        description: Run only Phase 1 and the Phase 6 stage (SMOKE_ONLY_PHASE6=on)
        type: boolean
        default: true
      only-phase7:
        description: Run only Phase 1 and the Phase 7 stage (SMOKE_ONLY_PHASE7=on; wins over only-phase6)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: wondarr:record
          build-args: VERSION=0.0.0-record.${{ github.run_number }}
          cache-from: type=gha
      - name: List the recordings before the run
        run: (cd tests/gate/replay && find . -type f | sort) > /tmp/before.txt
      - name: Smoke test in record mode
        env:
          SMOKE_METADATA: record
          SMOKE_PHASE6: "on"
          SMOKE_PHASE7: "on"
          SMOKE_ONLY_PHASE6: ${{ inputs.only-phase6 && !inputs.only-phase7 && 'on' || 'off' }}
          SMOKE_ONLY_PHASE7: ${{ inputs.only-phase7 && 'on' || 'off' }}
        run: scripts/smoke-test.sh wondarr:record
      - name: Collect the new recordings
        if: always()
        run: |
          (cd tests/gate/replay && find . -type f | sort) > /tmp/after.txt
          comm -13 /tmp/before.txt /tmp/after.txt > /tmp/new.txt
          echo "$(wc -l < /tmp/new.txt) new recordings"
          mkdir -p /tmp/new-replay
          (cd tests/gate/replay && tar -cf - -T /tmp/new.txt) | (cd /tmp/new-replay && tar -xf -)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: new-gate-recordings
          path: /tmp/new-replay
          retention-days: 7
