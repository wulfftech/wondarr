version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # 8.x is commercially licensed; stay on the Apache-2.0 7.x line
      - dependency-name: FluentAssertions
        versions: [">= 8.0.0"]
      # The .NET stack stays on the 10.x LTS line (global.json pins SDK 10.0.x). Moving to a new .NET
      # major is one deliberate change (SDK, runtime packages, EF and its tool together), not single bumps:
      # dotnet-ef 11 alone needs the .NET 11 runtime and breaks `dotnet ef` here (Dependabot #67).
      - dependency-name: dotnet-ef
        update-types: ["version-update:semver-major"]
      - dependency-name: Microsoft.EntityFrameworkCore*
        update-types: ["version-update:semver-major"]
      - dependency-name: Microsoft.AspNetCore*
        update-types: ["version-update:semver-major"]
      - dependency-name: Microsoft.Extensions*
        update-types: ["version-update:semver-major"]
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      mantine:
        patterns: ["@mantine/*"]
      tanstack:
        patterns: ["@tanstack/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # The frontend build stage stays on a Node LTS line; odd-numbered majors are short-lived
      # (Dependabot #70, node 25). Moving to the next LTS is a deliberate change.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
