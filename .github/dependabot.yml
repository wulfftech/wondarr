version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # 8.x is commercially licensed; stay on the Apache-2.0 7.x line (docs/DECISIONS.md, 2026-09-28 #3)
      - dependency-name: FluentAssertions
        versions: [">= 8.0.0"]
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      mantine:
        patterns: ["@mantine/*"]
      tanstack:
        patterns: ["@tanstack/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
